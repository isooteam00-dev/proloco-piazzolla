    <style>
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Social Cards */
        .social-cards {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .social-card {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .social-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-gold);
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
            font-size: 1.5rem;
            color: white;
        }

        .icon-facebook { background: #1877F2; }
        .icon-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285aeb 90%); }
        .icon-whatsapp { background: #25D366; }
        .icon-email { background: var(--accent-blue); }

        .social-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
            font-family: 'Fira Sans', sans-serif;
            color: var(--accent-blue);
        }

        .social-info p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Contact Form */
        .contact-form {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--accent-blue);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 1rem;
            background: var(--bg-primary);
            border: 1px solid #ced4da;
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 75, 135, 0.1);
        }

        @media (max-width: 768px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <app-header></app-header>

                <!-- Colonna Form -->
                <div class="contact-form">
                    <a href="index.html#tesseramento-form" style="display: block; text-decoration: none; margin-bottom: 1.5rem;">

                    <form action="mailto:prolocopiazzolla@gmail.com" method="POST" enctype="text/plain">
